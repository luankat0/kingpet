<kp-cabecalho titulo="Meu perfil" descricao="Identificação da sessão atual." />
<section class="painel ficha">
    @if (usuario(); as conta) {
        <div class="identidade">
            <span class="avatar grande">{{ iniciais() }}</span>
            <div>
                <h2>{{ conta.nome }}</h2>
                <p>{{ conta.funcao }}</p>
            </div>
        </div>
        <dl>
            <dt>E-mail</dt>
            <dd>{{ conta.email }}</dd>
            <dt>Tipo de acesso</dt>
            <dd>Sessão autenticada pela API do KingPet</dd>
        </dl>
    }
    <p-button
        label="Sair da conta" ariaLabel="Sair da conta"
        severity="secondary"
        [outlined]="true"
        icon="pi pi-sign-out"
        (onClick)="sair()"
    />
</section>
