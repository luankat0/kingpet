<kp-cabecalho titulo="Meu perfil" descricao="Identificação da sessão atual." />
<section class="painel ficha">
    <div class="identidade">
        <span class="avatar grande">AM</span>
        <div>
            <h2>{{ authService.usuario.nome }}</h2>
            <p>{{ authService.usuario.funcao }}</p>
        </div>
    </div>
    <dl>
        <dt>E-mail</dt>
        <dd>{{ authService.usuario.email }}</dd>
        <dt>Tipo de acesso</dt>
        <dd>Sessão demonstrativa local</dd>
    </dl>
    <p-button
        label="Sair da conta" ariaLabel="Sair da conta"
        severity="secondary"
        [outlined]="true"
        icon="pi pi-sign-out"
        (onClick)="sair()"
    />
</section>
